# Model Gateway config for the dev VM (spike S-4, docs/m0/hindsight.md).
# install.sh copies it to /etc/aios/gateway.yaml.
# Only local routes: llama-server from dev/vm/llm (docs/spikes/S-13-m0.md).
listen: "127.0.0.1:8090"

# A 4B model on 4 vCPU needs more than the 120 s default for long extractions.
request_timeout_s: 300

models:
  s1-local:
    kind: local
    endpoint: "http://127.0.0.1:8081/v1"
    model: "Qwen3-4B-Instruct-2507"
  embed-local:
    kind: local
    endpoint: "http://127.0.0.1:8082/v1"
    model: "multilingual-e5-large-instruct"

routes:
  - model: s1
    use: [s1-local]

embeddings_model: embed-local

clients:
  hindsight:
    cloud: false
    key_scope: service
