[project]
name = "aiosd-cognition"
version = "0.0.1"
description = "AiOS cognition: router, L2 loop, aiosctl (M0). Spec: docs/m0/cognition.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.15",
    "mcp>=2.3,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
aiosctl = "aiosd_cognition.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiosd_cognition"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
