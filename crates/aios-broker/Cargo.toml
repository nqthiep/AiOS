[package]
name = "aios-broker"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aios-types.workspace = true
aios-policy.workspace = true
aios-confirm.workspace = true
aios-audit.workspace = true
aios-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
getrandom = { version = "0.3", features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
jsonschema = { version = "0.59", default-features = false }
nix = { version = "0.30", default-features = false, features = ["user"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
