[project]
name = "aios-sys"
version = "0.1.0"
description = "AiOS MCP tool plugin aios.sys: sys.info (M0). Spec: docs/m0/tools3.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aios_sys"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
